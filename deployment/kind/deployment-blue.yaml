apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
      version: blue
  template:
    metadata:
      labels:
        app: springboot-app
        version: blue
    spec:
      containers:
        - name: springboot-app
          image: springbooteks:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9191
          readinessProbe:
            httpGet:
              path: /demo/spring
              port: 9191
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: service-blue
spec:
  type: NodePort
  selector:
    app: springboot-app
    version: blue
  ports:
    - port: 9191
      targetPort: 9191
      nodePort: 30080
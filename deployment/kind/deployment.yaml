apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
      version: blue
  template:
    metadata:
      labels:
        app: springboot-app
        version: blue
    spec:
      containers:
        - name: springboot-app
          image: springbooteks:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9191

---
apiVersion: v1
kind: Service
metadata:
  name: springboot-service
spec:
  type: NodePort
  selector:
    app: springboot-app
    version: blue
  ports:
    - port: 9191
      targetPort: 9191
      nodePort: 30080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-green-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: springboot-eks
      version: green
  template:
    metadata:
      labels:
        app: springboot-eks
        version: green
    spec:
      containers:
        - name: springboot-eks
          image: 911291530745.dkr.ecr.ap-south-1.amazonaws.com/springbooteks:2
          ports:
            - containerPort: 9191
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"